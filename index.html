<!DOCTYPE html>
<html lang="ru" data-theme="system">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Заметки & Дела — NotesFlow</title>
  <meta name="description" content="Красивый менеджер заметок и дел с памятью, сменой темы и напоминаниями" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    :root {
      --bg: #f4f6f9;
      --bg-elevated: #ffffff;
      --bg-glass: rgba(255, 255, 255, 0.72);
      --border: rgba(0, 0, 0, 0.08);
      --text: #0f172a;
      --text-secondary: #64748b;
      --text-muted: #94a3b8;
      --accent: #6366f1;
      --accent-hover: #4f46e5;
      --accent-soft: rgba(99, 102, 241, 0.12);
      --success: #10b981;
      --warning: #f59e0b;
      --danger: #ef4444;
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.06);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.1);
      --radius: 16px;
      --sidebar-width: 280px;
      --transition: 0.22s cubic-bezier(0.4, 0, 0.2, 1);
    }

    [data-theme="dark"] {
      --bg: #0b0f19;
      --bg-elevated: #131825;
      --bg-glass: rgba(19, 24, 37, 0.78);
      --border: rgba(255, 255, 255, 0.08);
      --text: #f1f5f9;
      --text-secondary: #94a3b8;
      --text-muted: #64748b;
      --accent: #818cf8;
      --accent-hover: #a5b4fc;
      --accent-soft: rgba(129, 140, 248, 0.15);
      --shadow: 0 4px 24px rgba(0, 0, 0, 0.35);
      --shadow-lg: 0 12px 40px rgba(0, 0, 0, 0.5);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    html, body {
      height: 100%;
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text);
      transition: background var(--transition), color var(--transition);
      overflow: hidden;
    }

    body::before {
      content: '';
      position: fixed;
      inset: 0;
      background:
        radial-gradient(ellipse 80% 50% at 20% -20%, rgba(99, 102, 241, 0.18), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(16, 185, 129, 0.12), transparent);
      pointer-events: none;
      z-index: 0;
    }

    [data-theme="dark"] body::before {
      background:
        radial-gradient(ellipse 80% 50% at 20% -20%, rgba(99, 102, 241, 0.25), transparent),
        radial-gradient(ellipse 60% 40% at 80% 100%, rgba(16, 185, 129, 0.1), transparent);
    }

    #app {
      display: flex;
      height: 100%;
      position: relative;
      z-index: 1;
    }

    /* ===== SIDEBAR ===== */
    .sidebar {
      width: var(--sidebar-width);
      background: var(--bg-glass);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      flex-shrink: 0;
      transition: transform var(--transition);
    }

    .sidebar-header {
      padding: 20px 18px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 700;
      font-size: 1.15rem;
      letter-spacing: -0.02em;
    }

    .logo-icon {
      width: 34px;
      height: 34px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 10px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 16px;
      box-shadow: 0 4px 12px rgba(99, 102, 241, 0.4);
    }

    .theme-btn, .notif-btn {
      width: 36px;
      height: 36px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text-secondary);
      cursor: pointer;
      display: grid;
      place-items: center;
      transition: all var(--transition);
      font-size: 15px;
    }

    .theme-btn:hover, .notif-btn:hover {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: transparent;
    }

    .notif-btn.active {
      background: var(--accent-soft);
      color: var(--accent);
      border-color: transparent;
    }

    .header-actions {
      display: flex;
      gap: 6px;
    }

    .nav-tabs {
      display: flex;
      gap: 4px;
      padding: 0 14px 14px;
    }

    .nav-tab {
      flex: 1;
      padding: 9px 6px;
      border: none;
      background: transparent;
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      border-radius: 10px;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
    }

    .nav-tab.active {
      background: var(--accent-soft);
      color: var(--accent);
    }

    .nav-tab:hover:not(.active) {
      background: var(--border);
      color: var(--text);
    }

    .sidebar-content {
      flex: 1;
      overflow-y: auto;
      padding: 0 12px 16px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .sidebar-content::-webkit-scrollbar { width: 5px; }
    .sidebar-content::-webkit-scrollbar-thumb {
      background: var(--border);
      border-radius: 10px;
    }

    .search-box {
      position: relative;
      margin-bottom: 14px;
    }

    .search-box input {
      width: 100%;
      padding: 10px 12px 10px 38px;
      border: 1px solid var(--border);
      border-radius: 12px;
      background: var(--bg-elevated);
      color: var(--text);
      font-size: 13.5px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .search-box input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .search-box svg {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      color: var(--text-muted);
      pointer-events: none;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.06em;
      color: var(--text-muted);
      padding: 8px 6px 6px;
    }

    .item-list {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .list-item {
      display: flex;
      align-items: flex-start;
      gap: 10px;
      padding: 10px 12px;
      border-radius: 12px;
      cursor: pointer;
      transition: background var(--transition);
      border: 1px solid transparent;
      position: relative;
    }

    .list-item:hover { background: var(--border); }
    .list-item.active {
      background: var(--accent-soft);
      border-color: rgba(99, 102, 241, 0.2);
    }

    .list-item .check {
      width: 18px;
      height: 18px;
      border-radius: 6px;
      border: 2px solid var(--text-muted);
      flex-shrink: 0;
      margin-top: 1px;
      display: grid;
      place-items: center;
      transition: all var(--transition);
      cursor: pointer;
    }

    .list-item .check.done {
      background: var(--success);
      border-color: var(--success);
      color: white;
    }

    .list-item .check.done svg { display: block; }
    .list-item .check svg { display: none; width: 12px; height: 12px; }

    .list-item-body { flex: 1; min-width: 0; }

    .list-item-title {
      font-size: 13.5px;
      font-weight: 500;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      line-height: 1.35;
    }

    .list-item.done .list-item-title {
      text-decoration: line-through;
      color: var(--text-muted);
    }

    .list-item-meta {
      font-size: 11.5px;
      color: var(--text-muted);
      margin-top: 3px;
      display: flex;
      gap: 6px;
      align-items: center;
      flex-wrap: wrap;
    }

    .priority {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      flex-shrink: 0;
    }
    .priority.high { background: var(--danger); }
    .priority.medium { background: var(--warning); }
    .priority.low { background: var(--success); }

    .date-badge {
      font-size: 11px;
      font-weight: 600;
      padding: 2px 7px;
      border-radius: 6px;
      line-height: 1.3;
    }
    .date-badge.today {
      background: rgba(99, 102, 241, 0.15);
      color: var(--accent);
    }
    .date-badge.tomorrow {
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
    }
    .date-badge.overdue {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
    }

    .empty-state {
      text-align: center;
      padding: 32px 16px;
      color: var(--text-muted);
      font-size: 13.5px;
    }
    .empty-state svg { margin-bottom: 10px; opacity: 0.5; }

    .sidebar-footer {
      padding: 12px 14px;
      border-top: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      padding: 10px 14px;
      border-radius: 11px;
      font-size: 13.5px;
      font-weight: 500;
      font-family: inherit;
      border: none;
      cursor: pointer;
      transition: all var(--transition);
      white-space: nowrap;
    }

    .btn-primary {
      background: var(--accent);
      color: white;
      box-shadow: 0 2px 8px rgba(99, 102, 241, 0.35);
    }
    .btn-primary:hover {
      background: var(--accent-hover);
      transform: translateY(-1px);
    }

    .btn-ghost {
      background: transparent;
      color: var(--text-secondary);
      border: 1px solid var(--border);
    }
    .btn-ghost:hover {
      background: var(--border);
      color: var(--text);
    }

    .btn-full { width: 100%; }

    .btn-danger {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
    }
    .btn-danger:hover { background: rgba(239, 68, 68, 0.22); }

    .notif-banner {
      padding: 10px 12px;
      background: var(--accent-soft);
      border-radius: 12px;
      font-size: 12.5px;
      color: var(--accent);
      display: flex;
      align-items: center;
      gap: 8px;
      cursor: pointer;
      transition: opacity var(--transition);
    }
    .notif-banner:hover { opacity: 0.85; }
    .notif-banner.hidden { display: none; }

    /* ===== MAIN ===== */
    .main {
      flex: 1;
      display: flex;
      flex-direction: column;
      min-width: 0;
    }

    .main-header {
      padding: 18px 28px 12px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      flex-shrink: 0;
    }

    .main-title {
      font-size: 1.35rem;
      font-weight: 700;
      letter-spacing: -0.03em;
    }

    .main-actions {
      display: flex;
      gap: 8px;
      align-items: center;
    }

    .editor-area {
      flex: 1;
      overflow-y: auto;
      padding: 8px 28px 40px;
      scrollbar-width: thin;
      scrollbar-color: var(--border) transparent;
    }

    .note-editor {
      max-width: 720px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(8px); }
      to { opacity: 1; transform: none; }
    }

    .note-title-input {
      width: 100%;
      border: none;
      background: transparent;
      font-size: 1.75rem;
      font-weight: 700;
      color: var(--text);
      font-family: inherit;
      outline: none;
      letter-spacing: -0.03em;
      margin-bottom: 8px;
      padding: 4px 0;
    }
    .note-title-input::placeholder { color: var(--text-muted); }

    .note-meta-row {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 20px;
      flex-wrap: wrap;
    }

    .note-content {
      width: 100%;
      min-height: 320px;
      border: none;
      background: transparent;
      font-size: 15.5px;
      line-height: 1.7;
      color: var(--text);
      font-family: inherit;
      outline: none;
      resize: none;
    }
    .note-content::placeholder { color: var(--text-muted); }

    .todo-detail {
      max-width: 560px;
      margin: 0 auto;
      animation: fadeIn 0.3s ease;
    }

    .todo-card {
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      box-shadow: var(--shadow);
    }

    .form-group { margin-bottom: 18px; }

    .form-label {
      display: block;
      font-size: 12.5px;
      font-weight: 600;
      color: var(--text-secondary);
      margin-bottom: 6px;
    }

    .form-input, .form-select, .form-textarea {
      width: 100%;
      padding: 11px 14px;
      border: 1px solid var(--border);
      border-radius: 11px;
      background: var(--bg);
      color: var(--text);
      font-size: 14.5px;
      font-family: inherit;
      outline: none;
      transition: border-color var(--transition), box-shadow var(--transition);
    }

    .form-input:focus, .form-select:focus, .form-textarea:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 3px var(--accent-soft);
    }

    .form-textarea {
      min-height: 100px;
      resize: vertical;
    }

    .form-row {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 14px;
    }

    .priority-selector {
      display: flex;
      gap: 8px;
    }

    .priority-btn {
      flex: 1;
      padding: 10px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg);
      color: var(--text-secondary);
      font-size: 13px;
      font-weight: 500;
      cursor: pointer;
      transition: all var(--transition);
      font-family: inherit;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
    }

    .priority-btn.active { border-color: transparent; }
    .priority-btn[data-p="high"].active {
      background: rgba(239, 68, 68, 0.12);
      color: var(--danger);
    }
    .priority-btn[data-p="medium"].active {
      background: rgba(245, 158, 11, 0.12);
      color: var(--warning);
    }
    .priority-btn[data-p="low"].active {
      background: rgba(16, 185, 129, 0.12);
      color: var(--success);
    }

    .welcome {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100%;
      text-align: center;
      padding: 40px;
      color: var(--text-secondary);
    }

    .welcome h2 {
      font-size: 1.5rem;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 8px;
      letter-spacing: -0.02em;
    }

    .welcome p {
      max-width: 360px;
      line-height: 1.6;
      margin-bottom: 24px;
    }

    .welcome-icon {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #6366f1, #8b5cf6);
      border-radius: 22px;
      display: grid;
      place-items: center;
      color: white;
      font-size: 32px;
      margin-bottom: 20px;
      box-shadow: 0 8px 24px rgba(99, 102, 241, 0.35);
    }

    .mobile-menu-btn {
      display: none;
      width: 40px;
      height: 40px;
      border-radius: 10px;
      border: 1px solid var(--border);
      background: var(--bg-elevated);
      color: var(--text);
      cursor: pointer;
      place-items: center;
      font-size: 18px;
    }

    .overlay {
      display: none;
      position: fixed;
      inset: 0;
      background: rgba(0,0,0,0.4);
      z-index: 40;
    }

    .stats {
      display: flex;
      gap: 16px;
      padding: 0 14px 12px;
      font-size: 12px;
      color: var(--text-muted);
    }
    .stat strong {
      color: var(--text-secondary);
      font-weight: 600;
    }

    .toast {
      position: fixed;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%) translateY(80px);
      background: var(--bg-elevated);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 12px 20px;
      border-radius: 12px;
      font-size: 13.5px;
      font-weight: 500;
      box-shadow: var(--shadow-lg);
      z-index: 100;
      transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1);
      pointer-events: none;
    }
    .toast.show {
      transform: translateX(-50%) translateY(0);
    }

    @media (max-width: 768px) {
      .sidebar {
        position: fixed;
        left: 0;
        top: 0;
        bottom: 0;
        z-index: 50;
        transform: translateX(-100%);
        width: 300px;
        box-shadow: var(--shadow-lg);
      }
      .sidebar.open { transform: translateX(0); }
      .overlay.open { display: block; }
      .mobile-menu-btn { display: grid; }
      .main-header { padding: 14px 16px 10px; }
      .editor-area { padding: 8px 16px 32px; }
      .form-row { grid-template-columns: 1fr; }
      .note-title-input { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <div id="app">
    <div class="overlay" id="overlay"></div>

    <aside class="sidebar" id="sidebar">
      <div class="sidebar-header">
        <div class="logo">
          <div class="logo-icon">✦</div>
          <span>NotesFlow</span>
        </div>
        <div class="header-actions">
          <button class="notif-btn" id="notifBtn" title="Напоминания">🔔</button>
          <button class="theme-btn" id="themeBtn" title="Сменить тему">◐</button>
        </div>
      </div>

      <div class="nav-tabs">
        <button class="nav-tab active" data-view="todos">Дела</button>
        <button class="nav-tab" data-view="notes">Заметки</button>
      </div>

      <div class="stats" id="stats"></div>

      <div class="sidebar-content">
        <div class="search-box">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
          <input type="text" id="searchInput" placeholder="Поиск..." autocomplete="off" />
        </div>

        <div id="listContainer"></div>
      </div>

      <div class="sidebar-footer">
        <div class="notif-banner hidden" id="notifBanner">
          🔔 Включить напоминания
        </div>
        <button class="btn btn-primary btn-full" id="addBtn">
          <svg width="16" height="16" fill="none" stroke="currentColor" stroke-width="2.2" viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>
          <span id="addBtnText">Новое дело</span>
        </button>
      </div>
    </aside>

    <main class="main">
      <div class="main-header">
        <div style="display:flex;align-items:center;gap:12px">
          <button class="mobile-menu-btn" id="menuBtn">☰</button>
          <h1 class="main-title" id="mainTitle">Дела</h1>
        </div>
        <div class="main-actions" id="mainActions"></div>
      </div>

      <div class="editor-area" id="editorArea">
        <div class="welcome" id="welcome">
          <div class="welcome-icon">✦</div>
          <h2>Добро пожаловать в NotesFlow</h2>
          <p>Создавай дела и заметки. Всё сохраняется автоматически. Включи напоминания — и приложение подскажет, что нужно сделать сегодня.</p>
          <button class="btn btn-primary" id="welcomeAddBtn">Создать первое дело</button>
        </div>
      </div>
    </main>
  </div>

  <div class="toast" id="toast"></div>

  <script>
    // ==================== STATE & STORAGE ====================
    const STORAGE_KEY = 'notesflow_v2';

    const defaultData = {
      todos: [],
      notes: [],
      theme: 'system',
      activeView: 'todos',
      activeId: null,
      notified: {} // { todoId: 'YYYY-MM-DD' }
    };

    let state = loadState();

    function loadState() {
      try {
        const raw = localStorage.getItem(STORAGE_KEY);
        if (raw) {
          const parsed = JSON.parse(raw);
          return { ...defaultData, ...parsed };
        }
        // migrate from v1 if exists
        const old = localStorage.getItem('notesflow_v1');
        if (old) {
          const parsed = JSON.parse(old);
          return { ...defaultData, ...parsed, notified: {} };
        }
      } catch (e) {}
      return { ...defaultData };
    }

    function saveState() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        todos: state.todos,
        notes: state.notes,
        theme: state.theme,
        activeView: state.activeView,
        activeId: state.activeId,
        notified: state.notified
      }));
    }

    function uid() {
      return Date.now().toString(36) + Math.random().toString(36).slice(2, 8);
    }

    // ==================== THEME ====================
    function applyTheme() {
      let theme = state.theme;
      if (theme === 'system') {
        theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
      }
      document.documentElement.setAttribute('data-theme', theme);
      const btn = document.getElementById('themeBtn');
      btn.textContent = theme === 'dark' ? '☀' : '☾';
      btn.title = theme === 'dark' ? 'Светлая тема' : 'Тёмная тема';
    }

    function cycleTheme() {
      const order = ['light', 'dark', 'system'];
      const idx = order.indexOf(state.theme);
      state.theme = order[(idx + 1) % order.length];
      saveState();
      applyTheme();
      toast(state.theme === 'system' ? 'Системная тема' : state.theme === 'dark' ? 'Тёмная тема' : 'Светлая тема');
    }

    window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
      if (state.theme === 'system') applyTheme();
    });

    // ==================== REMINDERS ====================
    function todayStr() {
      const d = new Date();
      return d.toISOString().slice(0, 10);
    }

    function isToday(iso) {
      if (!iso) return false;
      return iso.slice(0, 10) === todayStr();
    }

    function isTomorrow(iso) {
      if (!iso) return false;
      const t = new Date();
      t.setDate(t.getDate() + 1);
      return iso.slice(0, 10) === t.toISOString().slice(0, 10);
    }

    function isOverdue(iso) {
      if (!iso) return false;
      const d = new Date(iso.slice(0, 10));
      const today = new Date();
      today.setHours(0, 0, 0, 0);
      return d < today;
    }

    function updateNotifUI() {
      const btn = document.getElementById('notifBtn');
      const banner = document.getElementById('notifBanner');
      const perm = Notification.permission;

      if (perm === 'granted') {
        btn.classList.add('active');
        btn.title = 'Напоминания включены';
        banner.classList.add('hidden');
      } else if (perm === 'denied') {
        btn.classList.remove('active');
        btn.title = 'Уведомления запрещены в настройках браузера';
        banner.classList.add('hidden');
      } else {
        btn.classList.remove('active');
        btn.title = 'Включить напоминания';
        banner.classList.remove('hidden');
      }
    }

    async function requestNotifications() {
      if (!('Notification' in window)) {
        toast('Браузер не поддерживает уведомления');
        return;
      }
      if (Notification.permission === 'granted') {
        toast('Напоминания уже включены');
        checkReminders(true);
        return;
      }
      if (Notification.permission === 'denied') {
        toast('Разреши уведомления в настройках браузера');
        return;
      }
      const result = await Notification.requestPermission();
      updateNotifUI();
      if (result === 'granted') {
        toast('Напоминания включены 🔔');
        checkReminders(true);
      } else {
        toast('Уведомления отклонены');
      }
    }

    function showNotification(title, body, todoId) {
      if (Notification.permission !== 'granted') return;
      try {
        const n = new Notification(title, {
          body: body,
          icon: 'data:image/svg+xml,<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><rect width="100" height="100" rx="22" fill="%236366f1"/><text x="50" y="68" font-size="50" text-anchor="middle" fill="white">✦</text></svg>',
          tag: 'notesflow-' + todoId, // prevents duplicates
          requireInteraction: false
        });
        n.onclick = () => {
          window.focus();
          state.activeView = 'todos';
          state.activeId = todoId;
          saveState();
          renderAll();
          n.close();
        };
      } catch (e) {}
    }

    function checkReminders(force = false) {
      if (Notification.permission !== 'granted') return;

      const today = todayStr();
      let count = 0;

      state.todos.forEach(todo => {
        if (todo.done || !todo.due) return;

        const dueToday = isToday(todo.due);
        const overdue = isOverdue(todo.due);

        if (!dueToday && !overdue) return;

        // already notified today?
        if (!force && state.notified[todo.id] === today) return;

        const label = overdue ? 'Просрочено' : 'Сегодня';
        showNotification(
          `${label}: ${todo.text}`,
          todo.notes ? todo.notes.slice(0, 80) : 'Открой NotesFlow, чтобы отметить выполненным',
          todo.id
        );
        state.notified[todo.id] = today;
        count++;
      });

      if (count > 0) {
        saveState();
        if (force) toast(`Напоминаний: ${count}`);
      }
    }

    // ==================== HELPERS ====================
    function toast(msg) {
      const el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(el._t);
      el._t = setTimeout(() => el.classList.remove('show'), 2400);
    }

    function formatDate(iso) {
      if (!iso) return '';
      if (isToday(iso)) return 'Сегодня';
      if (isTomorrow(iso)) return 'Завтра';
      if (isOverdue(iso)) {
        const d = new Date(iso);
        return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
      }
      const d = new Date(iso);
      return d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' });
    }

    function dateBadgeClass(iso, done) {
      if (done || !iso) return '';
      if (isOverdue(iso)) return 'overdue';
      if (isToday(iso)) return 'today';
      if (isTomorrow(iso)) return 'tomorrow';
      return '';
    }

    function getFilteredTodos() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let list = [...state.todos];
      if (q) {
        list = list.filter(t =>
          t.text.toLowerCase().includes(q) ||
          (t.notes || '').toLowerCase().includes(q)
        );
      }
      const prio = { high: 0, medium: 1, low: 2 };
      list.sort((a, b) => {
        if (a.done !== b.done) return a.done ? 1 : -1;
        if (a.due && b.due) return new Date(a.due) - new Date(b.due);
        if (a.due) return -1;
        if (b.due) return 1;
        return (prio[a.priority] || 2) - (prio[b.priority] || 2);
      });
      return list;
    }

    function getFilteredNotes() {
      const q = document.getElementById('searchInput').value.toLowerCase().trim();
      let list = [...state.notes];
      if (q) {
        list = list.filter(n =>
          n.title.toLowerCase().includes(q) ||
          n.content.toLowerCase().includes(q) ||
          (n.tags || []).some(t => t.toLowerCase().includes(q))
        );
      }
      list.sort((a, b) => new Date(b.updated) - new Date(a.updated));
      return list;
    }

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    // ==================== RENDER SIDEBAR ====================
    function renderList() {
      const container = document.getElementById('listContainer');
      const isTodos = state.activeView === 'todos';

      if (isTodos) {
        const todos = getFilteredTodos();
        const open = todos.filter(t => !t.done);
        const done = todos.filter(t => t.done);

        let html = '';
        if (todos.length === 0) {
          html = `<div class="empty-state">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M9 11l3 3L22 4"/><path d="M21 12v7a2 2 0 01-2 2H5a2 2 0 01-2-2V5a2 2 0 012-2h11"/></svg>
            <div>Нет дел. Создай первое!</div>
          </div>`;
        } else {
          if (open.length) {
            html += `<div class="section-label">Активные · ${open.length}</div><div class="item-list">`;
            open.forEach(t => html += todoItemHTML(t));
            html += `</div>`;
          }
          if (done.length) {
            html += `<div class="section-label" style="margin-top:14px">Выполненные · ${done.length}</div><div class="item-list">`;
            done.forEach(t => html += todoItemHTML(t));
            html += `</div>`;
          }
        }
        container.innerHTML = html;
      } else {
        const notes = getFilteredNotes();
        let html = '';
        if (notes.length === 0) {
          html = `<div class="empty-state">
            <svg width="40" height="40" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8z"/><path d="M14 2v6h6M16 13H8M16 17H8M10 9H8"/></svg>
            <div>Нет заметок. Создай первую!</div>
          </div>`;
        } else {
          html += `<div class="section-label">Все заметки · ${notes.length}</div><div class="item-list">`;
          notes.forEach(n => {
            const preview = n.content.slice(0, 60).replace(/\n/g, ' ') || 'Пустая заметка';
            html += `
              <div class="list-item ${state.activeId === n.id ? 'active' : ''}" data-id="${n.id}" data-type="note">
                <div class="list-item-body">
                  <div class="list-item-title">${escapeHtml(n.title || 'Без названия')}</div>
                  <div class="list-item-meta">${formatDate(n.updated)} · ${escapeHtml(preview)}${n.content.length > 60 ? '…' : ''}</div>
                </div>
              </div>`;
          });
          html += `</div>`;
        }
        container.innerHTML = html;
      }

      const openCount = state.todos.filter(t => !t.done).length;
      const dueTodayCount = state.todos.filter(t => !t.done && t.due && (isToday(t.due) || isOverdue(t.due))).length;
      document.getElementById('stats').innerHTML = `
        <div class="stat">Дела: <strong>${openCount}</strong></div>
        <div class="stat">На сегодня: <strong>${dueTodayCount}</strong></div>
        <div class="stat">Заметки: <strong>${state.notes.length}</strong></div>
      `;

      container.querySelectorAll('.list-item').forEach(el => {
        el.addEventListener('click', (e) => {
          if (e.target.closest('.check')) return;
          state.activeId = el.dataset.id;
          saveState();
          renderAll();
        });
      });

      container.querySelectorAll('.check').forEach(el => {
        el.addEventListener('click', (e) => {
          e.stopPropagation();
          const id = el.closest('.list-item').dataset.id;
          toggleTodo(id);
        });
      });
    }

    function todoItemHTML(t) {
      const badgeClass = dateBadgeClass(t.due, t.done);
      const dateLabel = formatDate(t.due);
      return `
        <div class="list-item ${t.done ? 'done' : ''} ${state.activeId === t.id ? 'active' : ''}" data-id="${t.id}" data-type="todo">
          <div class="check ${t.done ? 'done' : ''}">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"><path d="M5 13l4 4L19 7"/></svg>
          </div>
          <div class="list-item-body">
            <div class="list-item-title">${escapeHtml(t.text)}</div>
            <div class="list-item-meta">
              ${t.priority ? `<span class="priority ${t.priority}"></span>` : ''}
              ${t.due ? `<span class="date-badge ${badgeClass}">${dateLabel}</span>` : ''}
            </div>
          </div>
        </div>`;
    }

    // ==================== RENDER MAIN ====================
    function renderMain() {
      const area = document.getElementById('editorArea');
      const actions = document.getElementById('mainActions');
      const titleEl = document.getElementById('mainTitle');
      const isTodos = state.activeView === 'todos';

      titleEl.textContent = isTodos ? 'Дела' : 'Заметки';
      document.getElementById('addBtnText').textContent = isTodos ? 'Новое дело' : 'Новая заметка';

      if (!state.activeId) {
        area.innerHTML = `
          <div class="welcome">
            <div class="welcome-icon">✦</div>
            <h2>${isTodos ? 'Твои дела' : 'Твои заметки'}</h2>
            <p>${isTodos
              ? 'Выбери дело слева или создай новое. Поставь срок — и получишь напоминание.'
              : 'Выбери заметку слева или создай новую. Всё сохраняется автоматически.'}</p>
            <button class="btn btn-primary" id="welcomeAddBtn">${isTodos ? 'Создать дело' : 'Создать заметку'}</button>
          </div>`;
        actions.innerHTML = '';
        document.getElementById('welcomeAddBtn')?.addEventListener('click', createNew);
        return;
      }

      if (isTodos) {
        const todo = state.todos.find(t => t.id === state.activeId);
        if (!todo) {
          state.activeId = null;
          saveState();
          renderAll();
          return;
        }
        area.innerHTML = `
          <div class="todo-detail">
            <div class="todo-card">
              <div class="form-group">
                <label class="form-label">Что нужно сделать</label>
                <input class="form-input" id="todoText" value="${escapeHtml(todo.text)}" placeholder="Например: Купить молоко" />
              </div>
              <div class="form-group">
                <label class="form-label">Заметки / детали</label>
                <textarea class="form-textarea" id="todoNotes" placeholder="Дополнительная информация...">${escapeHtml(todo.notes || '')}</textarea>
              </div>
              <div class="form-row">
                <div class="form-group">
                  <label class="form-label">Срок (для напоминания)</label>
                  <input class="form-input" type="date" id="todoDue" value="${todo.due || ''}" />
                </div>
                <div class="form-group">
                  <label class="form-label">Приоритет</label>
                  <div class="priority-selector" id="prioSelector">
                    <button class="priority-btn ${todo.priority === 'high' ? 'active' : ''}" data-p="high">● Высокий</button>
                    <button class="priority-btn ${todo.priority === 'medium' ? 'active' : ''}" data-p="medium">● Средний</button>
                    <button class="priority-btn ${todo.priority === 'low' ? 'active' : ''}" data-p="low">● Низкий</button>
                  </div>
                </div>
              </div>
              <div style="display:flex;gap:10px;margin-top:8px;flex-wrap:wrap">
                <button class="btn btn-primary" id="saveTodoBtn">Сохранить</button>
                <button class="btn btn-ghost" id="toggleDoneBtn">${todo.done ? 'Вернуть в активные' : 'Отметить выполненным'}</button>
                <button class="btn btn-danger" id="deleteTodoBtn">Удалить</button>
              </div>
            </div>
          </div>`;

        actions.innerHTML = '';

        document.getElementById('saveTodoBtn').addEventListener('click', () => {
          todo.text = document.getElementById('todoText').value.trim() || 'Без названия';
          todo.notes = document.getElementById('todoNotes').value;
          todo.due = document.getElementById('todoDue').value || null;
          saveState();
          renderAll();
          toast('Сохранено');
          checkReminders();
        });

        document.getElementById('toggleDoneBtn').addEventListener('click', () => {
          todo.done = !todo.done;
          saveState();
          renderAll();
          toast(todo.done ? 'Выполнено ✓' : 'Возвращено в активные');
        });

        document.getElementById('deleteTodoBtn').addEventListener('click', () => {
          if (confirm('Удалить это дело?')) {
            state.todos = state.todos.filter(t => t.id !== todo.id);
            delete state.notified[todo.id];
            state.activeId = null;
            saveState();
            renderAll();
            toast('Удалено');
          }
        });

        document.querySelectorAll('#prioSelector .priority-btn').forEach(btn => {
          btn.addEventListener('click', () => {
            document.querySelectorAll('#prioSelector .priority-btn').forEach(b => b.classList.remove('active'));
            btn.classList.add('active');
            todo.priority = btn.dataset.p;
            saveState();
            renderList();
          });
        });

        ['todoText', 'todoNotes', 'todoDue'].forEach(id => {
          document.getElementById(id).addEventListener('change', () => {
            todo.text = document.getElementById('todoText').value.trim() || 'Без названия';
            todo.notes = document.getElementById('todoNotes').value;
            todo.due = document.getElementById('todoDue').value || null;
            saveState();
            renderList();
          });
        });
      } else {
        const note = state.notes.find(n => n.id === state.activeId);
        if (!note) {
          state.activeId = null;
          saveState();
          renderAll();
          return;
        }
        area.innerHTML = `
          <div class="note-editor">
            <input class="note-title-input" id="noteTitle" value="${escapeHtml(note.title)}" placeholder="Заголовок заметки" />
            <div class="note-meta-row">
              <span style="font-size:12.5px;color:var(--text-muted)">Обновлено ${formatDate(note.updated)}</span>
            </div>
            <textarea class="note-content" id="noteContent" placeholder="Начни писать...">${escapeHtml(note.content)}</textarea>
          </div>`;

        actions.innerHTML = `<button class="btn btn-ghost" id="deleteNoteBtn">Удалить</button>`;

        document.getElementById('deleteNoteBtn').addEventListener('click', () => {
          if (confirm('Удалить эту заметку?')) {
            state.notes = state.notes.filter(n => n.id !== note.id);
            state.activeId = null;
            saveState();
            renderAll();
            toast('Удалено');
          }
        });

        const saveNote = () => {
          note.title = document.getElementById('noteTitle').value.trim() || 'Без названия';
          note.content = document.getElementById('noteContent').value;
          note.updated = new Date().toISOString();
          saveState();
          renderList();
        };

        document.getElementById('noteTitle').addEventListener('input', saveNote);
        document.getElementById('noteContent').addEventListener('input', saveNote);
      }
    }

    function renderAll() {
      renderList();
      renderMain();
      document.querySelectorAll('.nav-tab').forEach(t => {
        t.classList.toggle('active', t.dataset.view === state.activeView);
      });
    }

    // ==================== ACTIONS ====================
    function createNew() {
      if (state.activeView === 'todos') {
        const todo = {
          id: uid(),
          text: '',
          notes: '',
          due: null,
          priority: 'medium',
          done: false,
          created: new Date().toISOString()
        };
        state.todos.unshift(todo);
        state.activeId = todo.id;
      } else {
        const note = {
          id: uid(),
          title: '',
          content: '',
          tags: [],
          updated: new Date().toISOString(),
          created: new Date().toISOString()
        };
        state.notes.unshift(note);
        state.activeId = note.id;
      }
      saveState();
      renderAll();
      setTimeout(() => {
        if (state.activeView === 'todos') {
          document.getElementById('todoText')?.focus();
        } else {
          document.getElementById('noteTitle')?.focus();
        }
      }, 50);
    }

    function toggleTodo(id) {
      const todo = state.todos.find(t => t.id === id);
      if (todo) {
        todo.done = !todo.done;
        saveState();
        renderAll();
      }
    }

    // ==================== EVENTS ====================
    document.getElementById('themeBtn').addEventListener('click', cycleTheme);
    document.getElementById('notifBtn').addEventListener('click', requestNotifications);
    document.getElementById('notifBanner').addEventListener('click', requestNotifications);
    document.getElementById('addBtn').addEventListener('click', createNew);
    document.getElementById('searchInput').addEventListener('input', () => renderList());

    document.querySelectorAll('.nav-tab').forEach(tab => {
      tab.addEventListener('click', () => {
        state.activeView = tab.dataset.view;
        state.activeId = null;
        saveState();
        renderAll();
        closeSidebar();
      });
    });

    const sidebar = document.getElementById('sidebar');
    const overlay = document.getElementById('overlay');
    document.getElementById('menuBtn').addEventListener('click', () => {
      sidebar.classList.add('open');
      overlay.classList.add('open');
    });
    overlay.addEventListener('click', closeSidebar);
    function closeSidebar() {
      sidebar.classList.remove('open');
      overlay.classList.remove('open');
    }

    document.addEventListener('keydown', (e) => {
      if ((e.metaKey || e.ctrlKey) && e.key === 'n') {
        e.preventDefault();
        createNew();
      }
      if ((e.metaKey || e.ctrlKey) && e.key === 'k') {
        e.preventDefault();
        document.getElementById('searchInput').focus();
      }
    });

    // Init
    applyTheme();
    updateNotifUI();
    renderAll();

    // Check reminders on load and every 4 minutes while page is open
    setTimeout(() => checkReminders(), 1500);
    setInterval(() => checkReminders(), 4 * 60 * 1000);

    // Also check when tab becomes visible again
    document.addEventListener('visibilitychange', () => {
      if (document.visibilityState === 'visible') {
        checkReminders();
      }
    });
  </script>
</body>
</html>
